<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al ancho del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Lo que aparece en la pestaña y en los resultados de Google -->
  <title>TANOSOFT | Desarrollamos soluciones, construimos futuro</title>
  <meta name="description" content="TANOSOFT crea páginas web modernas, rápidas y funcionales para empresas y emprendedores.">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- FASE 2: aquí irá la barra de navegación -->

  <main>
    <!-- FASE 3: aquí irá el hero (la primera pantalla) -->

    <!-- TEMPORAL: muestra de la paleta -->
    <section class="seccion">
      <div class="contenedor">
        <h1>TANOSOFT</h1>
        <p>Desarrollamos soluciones, construimos futuro.</p>

        <div class="paleta">
          <!-- style="background: ..." pinta cada cuadro con una variable de la paleta -->
          <div class="muestra" style="background: var(--vino-oscuro)">Vino oscuro</div>
          <div class="muestra" style="background: var(--rojo-vino)">Rojo vino</div>
          <div class="muestra" style="background: var(--negro)">Negro</div>
          <div class="muestra" style="background: var(--gris-oscuro)">Gris oscuro</div>
          <div class="muestra" style="background: var(--blanco-rosado); color: #000">Blanco rosado</div>
          <div class="muestra" style="background: var(--gris-claro); color: #000">Gris claro</div>
        </div>
      </div>
    </section>

    <!-- FASES 4 a 10: aquí irán servicios, planes, proyectos, etc. -->
  </main>

  <!-- FASE 11: aquí irá el footer -->

  <script src="script.js"></script>
</body>
</html>
