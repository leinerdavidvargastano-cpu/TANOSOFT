<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Hace que la página se adapte al ancho del celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Lo que aparece en la pestaña y en los resultados de Google -->
  <title>TANOSOFT | Desarrollamos soluciones, construimos futuro</title>
  <meta name="description" content="TANOSOFT crea páginas web modernas, rápidas y funcionales para empresas y emprendedores.">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

   <header class="barra">
    <!-- aria-label: le dice a los lectores de pantalla qué es esta navegación -->
    <nav class="contenedor barra-interior" aria-label="Navegación principal">

      <!-- Logotipo: un monograma "TS" más el nombre. Es un enlace que lleva al inicio -->
      <a href="#inicio" class="logo" aria-label="TANOSOFT, ir al inicio">
        <!-- aria-hidden: el lector de pantalla se salta el monograma y lee solo el nombre -->
        <span class="logo-marca" aria-hidden="true">TS</span>
        <span class="logo-texto">TANO<span>SOFT</span></span>
      </a>

      <!-- Lista de enlaces. Cada href="#algo" apunta a una sección con ese id -->
      <ul class="menu" id="menu">
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#servicios">Servicios</a></li>
        <li><a href="#planes">Planes</a></li>
        <li><a href="#proyectos">Proyectos</a></li>
        <li><a href="#sobre-mi">Sobre mí</a></li>
        <li><a href="#tecnologias">Tecnologías</a></li>
        <li><a href="#contacto">Contacto</a></li>
        <li><a href="#contacto" class="boton">Crear mi página web</a></li>
      </ul>

    </nav>
  </header>

  <script src="script.js"></script>
</body>
</html>
